name: Deploy to GitHub Pages
on:
  push:
    branches: [claude/auto-mode-9ascfh]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site folder
        run: |
          mkdir -p _site
          cp -r app back-practice _site/
          cp index.html _site/
          touch _site/.nojekyll
      - name: Stamp service worker version
        # every deploy changes sw.js, so installed apps always pick up new files even if VERSION was not bumped
        run: |
          sed -i "s/^const VERSION = '\([^']*\)';/const VERSION = '\1-${GITHUB_SHA::7}';/" _site/app/sw.js
          grep -q "^const VERSION = '.*-${GITHUB_SHA::7}';" _site/app/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
